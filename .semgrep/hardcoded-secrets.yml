rules:
  - id: hardcoded-secret-assignment
    languages: [javascript, typescript]
    severity: ERROR
    message: Hardcoded secret assigned directly in source code. Use environment variables instead.
    patterns:
      - pattern-either:
          - pattern: const $VAR = "..."
          - pattern: let $VAR = "..."
          - pattern: var $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|secret|token|api[_-]?key|stripe)
