name: Deploy (GHA secrets)

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  IMAGE: secrets-demo-gha

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker
          docker build -t gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }} ./good-docker
          docker push gcr.io/${REGION}-docker.pkg.dev/$PROJECT_ID/$IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy secrets-demo-gha \
            --image gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }},STRIPE_KEY=${{ secrets.STRIPE_KEY }}
