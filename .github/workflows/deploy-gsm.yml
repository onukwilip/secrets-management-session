name: Deploy (Google Secret Manager)

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  IMAGE: secrets-demo-gsm

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set image tag
        id: image
        run: echo "tag=${REGION}-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev
          docker build -t ${{ steps.image.outputs.tag }} ./good-docker
          docker push ${{ steps.image.outputs.tag }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy secrets-demo-gsm \
            --image ${{ steps.image.outputs.tag }} \
            --region $REGION \
            --platform managed \
            --port=3000 \
            --set-secrets DB_PASSWORD=db-password:latest \
            --set-secrets STRIPE_KEY=stripe-key:latest
