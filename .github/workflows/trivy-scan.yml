name: Trivy Secret Scan (bad-docker)

on:
  workflow_dispatch:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secrets-demo-bad:latest ./bad-docker

      - name: Scan image filesystem for secrets
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secrets-demo-bad:latest
          scanners: secret
          exit-code: "1"
          severity: CRITICAL,HIGH,MEDIUM
