name: Semgrep Scan (bad-server)

on:
  workflow_dispatch:

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan bad-server for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source /src/bad-server --no-git --verbose

